<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIFEX - Funcionario ICA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/otherStyles.css">
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/funcionario.css">
    <link rel="stylesheet" href="../../css/intento.css">
    <link rel="stylesheet" href="../../css/perfil-modal.css">
</head>
<body>

    <div class="topbar">
        <span class="topbar-title">Funcionario ICA</span>
        <span class="topbar-user"></span>
        <button class="btn-salir">Salir</button>
    </div>

    <div class="layout">
        <nav class="sidebar">
            <div class="sidebar-logo">
                <span class="icon">🌿</span>
                <span>SIFEX</span>
            </div>
            <a class="nav-item" href="perfil.html"><span class="icon">👤</span> Perfil</a>
            <a class="nav-item" href="observaciones.html"><span class="icon">🔎</span> Gestionar observaciones</a>
            <a class="nav-item" href="solicitudes.html"><span class="icon">📩</span> Mis solicitudes</a>
            <div class="sidebar-bottom">
                <button class="btn-hide-menu" id="toggleSidebar">← Ocultar menú</button>
            </div>
        </nav>

        <main class="main">
            <div class="contenido-principal">
                <div id="contenido">
                    <div class="content">

                        <div class="toprow">
                            <span class="toprow-title">Mi perfil</span>
                        </div>

                        <div class="profile-layout">

                            <div class="profile-sidebar">
                                <div class="profile-avatar-wrapper">
                                    <div class="profile-avatar">
                                        <img src="../../img/IMG-20230323-WA0019.jpg" alt="Foto de perfil" id="avatar-img">
                                    </div>
                                    <p class="profile-avatar-hint" id="perfil-cedula"></p>
                                </div>
                                <div class="profile-sidebar-info">
                                    <span class="profile-sidebar-name" id="perfil-nombre"></span>
                                    <span class="profile-sidebar-label" id="perfil-rol"></span>
                                </div>
                            </div>

                            <div class="profile-form-col">
                                <div class="card">
                                    <div class="section-head">Contacto</div>
                                    <div class="grid2">
                                        <div class="field perfil-field-readonly">
                                            <label>Celular</label>
                                            <span id="perfil-celular-val">—</span>
                                        </div>
                                        <div class="field perfil-field-readonly">
                                            <label>Correo electrónico</label>
                                            <span id="perfil-correo-val">—</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="actions">
                                    <button class="btn-save" id="btn-actualizar" type="button">Actualizar perfil</button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL PERFIL -->
    <div class="modal-overlay" id="modal-perfil" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <div class="modal-box">

            <div class="modal-header">
                <h3 id="modal-titulo">Editar perfil</h3>
                <button id="modal-btn-cerrar-x" type="button" aria-label="Cerrar">✕</button>
            </div>

            <div class="modal-body">
                <div class="modal-info-card">
                    <div class="modal-info-item">
                        <span>Identificación</span>
                        <span id="modal-cedula"></span>
                    </div>
                    <div class="modal-info-item">
                        <span>Rol</span>
                        <span id="modal-rol"></span>
                    </div>
                </div>

                <p class="modal-divider">Datos personales</p>

                <div class="modal-grid2">
                    <div class="modal-field">
                        <label for="modal-primer-nombre">Primer nombre <span class="req">*</span></label>
                        <input type="text" id="modal-primer-nombre" placeholder="Ej: Juan">
                        <p class="modal-field-error" id="err-primer-nombre"></p>
                    </div>
                    <div class="modal-field">
                        <label for="modal-segundo-nombre">Segundo nombre</label>
                        <input type="text" id="modal-segundo-nombre" placeholder="Opcional">
                    </div>
                    <div class="modal-field">
                        <label for="modal-primer-apellido">Primer apellido <span class="req">*</span></label>
                        <input type="text" id="modal-primer-apellido" placeholder="Ej: Pérez">
                        <p class="modal-field-error" id="err-primer-apellido"></p>
                    </div>
                    <div class="modal-field">
                        <label for="modal-segundo-apellido">Segundo apellido</label>
                        <input type="text" id="modal-segundo-apellido" placeholder="Opcional">
                    </div>
                </div>

                <p class="modal-divider">Contacto</p>

                <div class="modal-grid2">
                    <div class="modal-field">
                        <label for="modal-celular">Celular <span class="req">*</span></label>
                        <input type="tel" id="modal-celular" placeholder="Ej: 3001234567">
                        <p class="modal-field-error" id="err-celular"></p>
                    </div>
                    <div class="modal-field">
                        <label for="modal-correo">Correo electrónico <span class="req">*</span></label>
                        <input type="email" id="modal-correo" placeholder="correo@ejemplo.com">
                        <p class="modal-field-error" id="err-correo"></p>
                    </div>
                </div>

                <p class="modal-divider">Seguridad</p>

                <div class="modal-field">
                    <label for="modal-password">Nueva contraseña <span class="modal-hint">(dejar vacío para no cambiar)</span></label>
                    <input type="password" id="modal-password" placeholder="Mínimo 6 caracteres">
                </div>
            </div>

            <div class="modal-footer">
                <button id="modal-btn-cancelar" type="button">Cancelar</button>
                <button class="modal-btn-guardar" id="modal-btn-guardar" type="button">Guardar cambios</button>
            </div>

        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../../js/perfil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
